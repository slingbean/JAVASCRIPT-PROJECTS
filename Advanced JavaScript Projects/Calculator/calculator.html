<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator | Object 001</title>

    <meta name="description" content="A functional calculator built with HTML, CSS, and JavaScript.">
    <meta name="author" content="Cara Slingsby">

    <!-- Link CSS File -->
    <link rel="stylesheet" href="css/calculator_css.css">

    <!-- Link JavaScript File -->
    <script src="javascript/calculator_javascript.js" defer></script>
</head>

<body>

    <!-- Calculator Container -->
    <main class="calculator">

        <!-- Calculator Header -->
        <header class="calculator-header">
            <span>OBJECT | 001</span>
            <span>CALCULATOR</span>
        </header>

        <!-- Calculator Screen -->
        <div class="screen-container">
            <input
                type="text"
                class="calculator-screen"
                value="0"
                aria-label="Calculator display"
                readonly
            >
        </div>

        <!-- Calculator Buttons -->
        <div class="calculator-keys">

            <!-- First Row -->
            <button type="button" value="7">7</button>
            <button type="button" value="8">8</button>
            <button type="button" value="9">9</button>
            <button type="button" class="operator" value="/">÷</button>

            <!-- Second Row -->
            <button type="button" value="4">4</button>
            <button type="button" value="5">5</button>
            <button type="button" value="6">6</button>
            <button type="button" class="operator" value="*">×</button>

            <!-- Third Row -->
            <button type="button" value="1">1</button>
            <button type="button" value="2">2</button>
            <button type="button" value="3">3</button>
            <button type="button" class="operator" value="-">−</button>

            <!-- Fourth Row -->
            <button type="button" class="all-clear function" value="all-clear">AC</button>
            <button type="button" value="0">0</button>
            <button type="button" class="decimal function" value=".">.</button>
            <button type="button" class="operator" value="+">+</button>

            <!-- Equals Button -->
            <button type="button" class="equal-sign" value="=">=</button>

        </div>

    </main>

</body>
</html>
