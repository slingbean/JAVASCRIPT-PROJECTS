<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>JavaScript Comparisons</title>
         
        <!--CSS Styling-->
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 30px;
                font-family: Georgia, "Times New Roman", serif;
                background-color: #eee7d8;
                color: #2d2925;
            }

            .page {
                width: 100%;
                max-width: 700px;
                padding: 55px 60px;
                background-color: #fffdf7;
                border: 1px solid #d5ccb9;
                box-shadow: 8px 8px 0 #d2c7b3;
                background-image: repeating-linear-gradient(
                    #fffdf7 0px,
                    #fffdf7 31px,
                    #e4ded2 32px
                );
            }

            .top-line {
                display: flex;
                justify-content: space-between;
                margin-bottom: 45px;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 13px;
                letter-spacing: 1px;
                text-transform: uppercase;
            }

            h1 {
                margin: 0 0 10px;
                font-size: 40px;
                font-weight: normal;
            }

            .subtitle {
                margin-bottom: 40px;
                font-size: 17px;
                font-style: italic;
            }

            .experiment {
                margin-bottom: 25px;
                padding: 25px 30px;
                background-color: #faf6eb;
                border: 2px solid #2d2925;
                box-shadow: 5px 5px 0 #d2c7b3;
            }

            .experiment-number {
                margin-bottom: 12px;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 11px;
                letter-spacing: 2px;
                text-transform: uppercase;
            }

            .experiment-title {
                margin: 0 0 10px;
                font-size: 22px;
                font-weight: normal;
            }

            .result {
                margin: 0;
                font-family: "Courier New", Courier, monospace;
                font-size: 15px;
                line-height: 1.7;
            }
        </style>
    </head>

    <body>
        <main class="page">

            <div class="top-line">
                <span>JavaScript</span>
                <span>Field Notes</span>
            </div>

            <h1>Comparisons &amp; Type Coercion</h1>

            <div class="subtitle">
                A collection of JavaScript expressions and comparisons.
            </div>

            <!-- Experiment 01-->
             <section class="experiment">
                <div class="experiment-number">
                    Experiment 01
                </div>

                <h2 class="experiment-title">
                    Data Type
                </h2>

                <p class="result" id="typeResult">
                    The data type of personName is:
            
                </p>
             </section>

             <!--Experiment 02-->
             <section class="experiment">
                <div class="experiment-number">
                    Experiment 02
                </div>

                <h2 class="experiment-title">
                    String + Number
                </h2>

                <p class="result" id="coercionResult"></p>
             </section>

             <!--Experiment 03-->
             <section class="experiment">
                <div class="experiment-number">
                    Experiment 03
                </div>

                <h2 class="experiment-title">
                    Comparison Operators
                </h2>

                <p class="result" id="comparisonResult"></p>
             </section>

             <!-- Experiment 04-->
              <section class="experiment">
                <div class="experiment-number">
                    Experiment 04
                </div>

                <h2 class="experiment-title">
                    Logical Operators
                </h2>

                <p class="result" id="logicalResult"></p>
                
              </section>
        </main>
        <!--Links JavaScript to the page-->
        <script src="JS/main.js"></script>

    </body>
</html>
