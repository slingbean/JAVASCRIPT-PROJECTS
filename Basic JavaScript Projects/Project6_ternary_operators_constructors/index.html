<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Surf Sessions</title>

        <!--Links JavaScript to the page-->
        <script src="JS/main.js"></script>
    

    <!-- CSS Styling -->
     <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            font-family: Georgia, "Times New Roman", serif;
            background-color: #eee8dc;
            color: #252522;
        }

        .field-note {
            width: 100%;
            max-width: 650px;
            padding: 50px;
            background-color: #fffdf7;
            border: 1px solid #d2c9b8;
            box-shadow: 8px 8px 0 #d3c9b8;
        }

        .label {
            margin-bottom: 12px;
            font-family: "Courier New", Courier, monospace;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 42px;
            font-weight: normal;
        }

        .subtitle {
            margin: 0 0 40px;
            font-size: 16px;
            font-style: italic;
        }

        .input-section {
            padding: 25px 0;
            border-top: 1px solid #cfc6b5;
            border-bottom: 1px solid #cfc6b5;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #8f887d;
            background-color: #faf7ef;
            font-family: "Courier New", Courier, monospace;
            font-size: 16px;
        }

        button {
            padding: 11px 18px;
            border: 1px solid #252522;
            background-color: transparent;
            color: #252522;
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            cursor: pointer;
        }

        button:hover {
            background-color: #252522;
            color: #fffdf7;
        }

        .result {
            margin: 25px 0 0;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            line-height: 1.7;
        }

        .session {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #cfc6b5;
        }

        .session-info {
            margin: 0;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            line-height: 1.8;
        }
     </style>
     </head>

     <body>

        <main class="field-note">

            <div class="label">
                Surf Field Note | 006
            </div>

            <h1>Surf Session</h1>

            <p class="subtitle">
                A simple wave height check for Cox Bay.
            </p>

            <!-- Wave Height Input-->
             <section class="input-section">

                <label for="waveHeight">
                    Cox Bay wave height in feet:
                </label>

                <input id="waveHeight" type="number" value="3">

                <button onclick="checkWaves()">
                    Check Conditions
                </button>

                <p class="result" id="waveResult"></p>
             </section>

             <!--Surf Session Information-->
             <section class="session">

                <div class="label">
                    Cox Bay | Session Details
                </div>

                <p class="session-info" id="sessionInfo"></p>

             </section>

        </main>

     </body>
</html>
