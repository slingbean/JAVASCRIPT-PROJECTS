<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>JavaScript Functions</title>

        <!-- Links the external JavaScript file to this HTML document -->
         <script src="JS/main.js"></script>

         <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: Arial, Helvetica, sans-serif;
                background-color: #f7f1f5;
                color: #3b3038;
            }

            .card {
                width: 90%;
                max-width: 500px;
                padding: 45px;
                text-align: center;
                background-color: #fffafc;
                border: 1px solid #ead9e2;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(80, 50, 70, 0.12);
            }

            h1 {
                margin-bottom: 15px;
                color: #8b5e83;
            }

            p {
                margin-bottom: 30px;
                line-height: 1.6;
            }

            button {
                padding: 12px 24px;
                border: none;
                border-radius: 25px;
                background-color: #8b5e83;
                color: white;
                font-size: 16px;
                cursor: pointer;
            }

            button:hover {
                background-color: #704b69;
            }
         </style>
    </head>

    <body>

        <div class="card">
            <h1>&#9734; A Little JavaScript &#9734;</h1>

            <p id="displayText">Click the button to reveal a little message.</p>

            <button onclick="myFunction()">Click Me</button>
        </div>

    </body>
</html>
